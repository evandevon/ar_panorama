<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2a24">
  <title>360° experience</title>
  <link rel="stylesheet" href="css/style.css?v=20261025e">
  <script src="vendor/aframe-v1.8.0.min.js"></script>
  <script src="js/sources.js?v=20261025e"></script>
  <script src="js/spots.js?v=20261025e"></script>
  <script src="js/layers.js?v=20261025e"></script>
  <script src="js/align.js?v=20261025e"></script>
</head>
<body>
  <!-- Live camera, shown under the faded 360 photo while lining up with the real room -->
  <video id="camfeed" class="camfeed" playsinline muted autoplay aria-hidden="true"></video>
  <!-- The 360 scene. Mouse/touch dragging is handled in viewer.js; A-Frame only does the phone-motion part. -->
  <main id="view" aria-label="360° view">
  <a-scene id="scene" embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
           loading-screen="enabled: false" renderer="colorManagement: true">
    <a-assets id="assets" timeout="1"></a-assets>
    <a-entity id="rig">
      <a-camera id="cam" position="0 0 0" fov="75" wasd-controls-enabled="false"
                look-controls="mouseEnabled: false; touchEnabled: false; magicWindowTrackingEnabled: false"></a-camera>
    </a-entity>
    <!-- rotation -90 puts the centre of the panorama straight ahead -->
    <a-sky id="sky" visible="false" radius="100" rotation="0 -90 0"></a-sky>
    <a-videosphere id="vsphere" visible="false" radius="100" rotation="0 -90 0"></a-videosphere>
  </a-scene>
  </main>

  <!-- Start card: the tap here is what lets phones use motion sensors and play sound -->
  <section id="start" class="card-wrap" aria-live="polite">
    <div class="card">
      <p class="eyebrow">360° experience</p>
      <h1 id="title">Loading…</h1>
      <div class="loading" id="loading" role="progressbar" aria-label="Loading the 360 photo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <p class="load-text"><span id="load-what">Loading the 360 photo…</span> <span class="load-size" id="load-size"></span></p>
        <div class="progress"><div id="bar"></div><span class="bar-pct" id="bar-pct" aria-hidden="true">0%</span></div>
      </div>
      <div class="choices" id="choices">
        <button id="go-align" class="go" disabled hidden>
          <span class="go-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg></span>
          <span><b>Line up with this room</b><small>Uses your camera to match the photo to the room around you</small></span>
        </button>
        <button id="go-motion" class="go" disabled hidden>
          <span class="go-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></span>
          <span><b>Move my phone</b><small>Hold it up and turn around to look</small></span>
        </button>
        <button id="go-drag" class="go" disabled>
          <span class="go-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg></span>
          <span><b id="drag-label">Drag to look</b><small id="drag-sub">Use your finger to move the picture</small></span>
        </button>
      </div>
      <p class="tip" id="tip"></p>
      <p class="tap-any" id="tap-any" hidden>or tap anywhere to start</p>
      <p class="embed-open" id="embed-open" hidden><a id="embed-open-link" target="_blank" rel="noopener">Open full screen ↗</a> — best on phones</p>
      <p id="error" class="error" role="alert" hidden></p>
    </div>
  </section>

  <!-- Controls once inside -->
  <nav id="toolbar" class="toolbar" aria-label="Viewer controls" hidden>
    <button id="btn-centre" title="Face the starting direction"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></span><span class="lbl">Recentre</span></button>
    <button id="btn-sound" hidden><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 4v16l13-8z"/></svg></span><span class="lbl">Play audio</span></button>
    <button id="btn-full" hidden title="Open in its own tab, full screen"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></svg></span><span class="lbl">Full screen</span></button>
  </nav>

  <!-- Moving the phone is the default; this small switch swaps to dragging with a finger (and back) -->
  <nav aria-label="How to look around">
  <button id="mode-toggle" class="mode-toggle" role="switch" aria-checked="true" hidden title="Look around by moving your phone, or turn this off to drag with your finger">
    <span class="mt-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></span>
    <span class="mt-lbl">Motion</span>
    <span class="mt-switch" aria-hidden="true"><span class="mt-knob"></span></span>
  </button>
  </nav>

  <!-- YouTube audio: YouTube's rules require its player to stay visible (at least 200×200) -->
  <div id="yt-wrap" class="yt-wrap" hidden><div id="yt"></div></div>

  <!-- Video spots are drawn here, over the 360 view -->
  <div id="spots" class="spots-layer" role="region" aria-label="Things in the room"></div>
  <div id="spots-offscreen" class="spots-offscreen" aria-hidden="true"></div>
  <div id="crosshair" class="crosshair" hidden aria-hidden="true"></div>

  <!-- Lining up with the real room -->
  <section id="align" class="align" hidden aria-label="Line up the photo with the room">
    <p id="align-status" class="align-status" role="status" aria-live="polite"></p>
    <!-- Shown instead of the controls when the camera can't start -->
    <div id="cam-help" class="cam-help" role="alertdialog" aria-labelledby="cam-help-title" aria-describedby="cam-help-text" hidden>
      <h2 id="cam-help-title">The camera didn’t start</h2>
      <p id="cam-help-text"></p>
      <ol id="cam-help-steps"></ol>
      <div class="cam-help-btns">
        <button id="cam-retry" class="align-btn">Try again</button>
        <button id="cam-switch" class="align-btn ghost" hidden>Switch camera</button>
        <button id="cam-copy" class="align-btn ghost" hidden>Copy link</button>
        <button id="cam-skip" class="align-btn ghost">Look around without the camera</button>
      </div>
    </div>
    <div class="align-panel">
      <label class="align-mix">
        <span>Then</span>
        <input type="range" id="align-mix" min="0.15" max="0.85" step="0.05" value="0.5" aria-label="Fade between the photo and the camera">
        <span>Now</span>
      </label>
      <div class="align-btns">
        <button id="align-skip" class="align-btn ghost">Skip</button>
        <button id="align-switch" class="align-btn ghost icon" hidden aria-label="Switch camera" title="Switch camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><path d="M9 13a3 3 0 0 1 5.2-2M15 13a3 3 0 0 1-5.2 2"/><path d="M14 9v2h-2M10 17v-2h2"/></svg></button>
        <button id="align-snap" class="align-btn ghost" hidden>Snap</button>
        <button id="align-ok" class="align-btn" hidden>Lined up ✓</button>
      </div>
      <p class="align-tip">Slide left or right on the screen to turn the photo. Pinch to make it bigger or smaller.</p>
    </div>
  </section>

  <p id="hint" class="hint" role="status" hidden></p>

  <!-- Then and now: drag the bar to wipe between the second photo (left) and the main one (right) -->
  <div id="compare" class="compare" hidden>
    <span class="cmp-name l" id="cmp-n2" hidden></span>
    <span class="cmp-name r" id="cmp-n1" hidden></span>
    <div class="cmp-bar" id="cmp-bar">
      <button type="button" class="cmp-grip" id="cmp-grip" role="slider" aria-label="Compare the two photos: left and right arrows move the divider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <audio id="audio" preload="auto" playsinline></audio>
  <script src="js/viewer.js?v=20261025e"></script>
</body>
</html>
